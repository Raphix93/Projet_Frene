name: Réintégration annotations TEI

on:
  workflow_dispatch:
  push:
    paths:
      - "data/Frene_volume_1/exports/TEI/Frene_volume_1.xml"
      - "data/Frene_volume_1/exports/Annotation/Frene_volume_1.annotations.json"
      - "tei-annotation/**"
      - ".github/workflows/tei-annotation.yml"

permissions:
  contents: write

concurrency:
  group: tei-annotation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  enrich-tei:
    runs-on: ubuntu-latest

    env:
      TEI_INPUT: data/Frene_volume_1/exports/TEI/Frene_volume_1.xml
      ANNOTATION_INPUT: data/Frene_volume_1/exports/Annotation/Frene_volume_1.annotations.json
      TEI_OUTPUT: data/Frene_volume_1/exports/TEI/Frene_volume_1_annotated.xml
      REPORT_OUTPUT: data/Frene_volume_1/exports/Annotation/Frene_volume_1.integration-report.json

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tei-annotation/requirements.txt

      - name: Installer les dépendances
        run: pip install -r tei-annotation/requirements.txt

      - name: Vérifier les fichiers d'entrée
        shell: bash
        run: |
          set -euo pipefail
          test -f "$TEI_INPUT" || { echo "TEI absente : $TEI_INPUT" >&2; exit 1; }
          test -f "$ANNOTATION_INPUT" || { echo "JSON absent : $ANNOTATION_INPUT" >&2; exit 1; }

      - name: Réintégrer les annotations dans la TEI
        run: |
          python tei-annotation/run.py \
            --tei "$TEI_INPUT" \
            --annotations "$ANNOTATION_INPUT" \
            --output "$TEI_OUTPUT" \
            --report "$REPORT_OUTPUT" \
            --allow-sha-mismatch \
            --fail-on-unmatched

      - name: Vérifier que la TEI est bien formée
        run: |
          python - <<'PY'
          from lxml import etree
          etree.parse("data/Frene_volume_1/exports/TEI/Frene_volume_1_annotated.xml")
          print("TEI XML bien formée.")
          PY

      - name: Enregistrer la TEI enrichie et le rapport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TEI_OUTPUT" "$REPORT_OUTPUT"

          if git diff --cached --quiet; then
            echo "Aucune modification à enregistrer."
            exit 0
          fi

          git commit -m "Génère la TEI enrichie avec les annotations"
          git push
