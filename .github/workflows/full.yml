name: Projet Frene full workflow

on:
  push:
    paths:
      - .github/workflows/**
      - data/**
      - alto2tei/**
      - PDFA2U/**
      - JPG/**
      - manifest_IIIF/**
      - metadata/**
      - text-extraction.py
      - config.yml
      - htr-united.yml
      - fonts/**
      - site/**

  pull_request:
    paths:
      - .github/workflows/**
      - data/**
      - alto2tei/**
      - PDFA2U/**
      - JPG/**
      - manifest_IIIF/**
      - metadata/**
      - text-extraction.py
      - config.yml
      - htr-united.yml
      - fonts/**
      - site/**

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: projet-frene-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.11"
  PYTHON_VERSION_HTR: "3.9"
  VOLUME_DIR: data/Frêne_volume_1
  IMAGES_DIR: data/Frêne_volume_1/Images
  JPG_DIR: data/Frêne_volume_1/exports/jpg
  PDF_DIR: data/Frêne_volume_1/exports/pdf
  SITE_JPG_DIR: site/images/volume_1
  IIIF_MANIFEST: site/iiif/manifest_Frene_volume_1.json
  BASE_URL: https://raphix93.github.io/Projet_Frene

jobs:
  ALTO2TEI:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml requests pyyaml

      - name: Create TEI files
        run: |
          python alto2tei/run.py \
            --config config.yml \
            --version "3.0.13" \
            --header \
            --sourcedoc \
            --body

      - name: List generated files after ALTO2TEI
        run: |
          find . -type f | sort

      - name: Commit generated TEI files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --ff-only
          git add ./data/
          git commit -m "[Automatic] Create TEI files" || echo "Nothing to commit"
          git push || echo "Nothing to push"

  MainZone:
    runs-on: ubuntu-latest
    needs: ALTO2TEI

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository after ALTO2TEI commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install lxml

      - name: Extract and collate text from MainZones
        run: |
          python text-extraction.py ./data/*

      - name: Commit generated TXT files
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --ff-only
          git add ./data/*.txt
          git commit -m "[Automatic] Extract text from MainZones" || echo "Nothing to commit"
          git push || echo "Nothing to push"

      - name: Create GitHub release on push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: rymndhng/release-on-push-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bump_version_scheme: patch
          use_github_release_notes: true

  HTR_United_Metadata_Generator:
    runs-on: ubuntu-latest
    needs: MainZone

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository after MainZone commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_HTR }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install htr-united-metadata-generator htruc anybadge

      - name: Generate HTR United metrics
        run: |
          humGenerator \
            --parse alto \
            --group ./data/**/*.xml \
            --github-envs \
            --to-json updated_metrics.json \
            --chars \
            -n NFD

          cat envs.txt >> $GITHUB_ENV

      - name: Get HTR United badge template
        if: github.ref == 'refs/heads/main'
        id: get
        uses: andymckay/get-gist-action@master
        with:
          gistURL: https://gist.github.com/PonteIneptique/7813bb99f234b334fbf9c6c429ec2406

      - name: Update catalog and badges
        if: github.ref == 'refs/heads/main'
        run: |
          htruc update-volumes \
            htr-united.yml \
            updated_metrics.json \
            --inplace

          mkdir -p badges

          anybadge --value=${{ env.HTRUNITED_CHARS }} --file=badges/characters.svg --label=Characters --color=#007ec6 --overwrite --template=${{ steps.get.outputs.file }}
          anybadge --value=${{ env.HTRUNITED_REGNS }} --file=badges/regions.svg --label=Regions --color=#007ec6 --overwrite --template=${{ steps.get.outputs.file }}
          anybadge --value=${{ env.HTRUNITED_LINES }} --file=badges/lines.svg --label=Lines --color=#007ec6 --overwrite --template=${{ steps.get.outputs.file }}
          anybadge --value=${{ env.HTRUNITED_FILES }} --file=badges/files.svg --label="XML Files" --color=#007ec6 --overwrite --template=${{ steps.get.outputs.file }}

          git config user.name github-actions
          git config user.email github-actions@github.com
          git pull --ff-only
          git add htr-united.yml badges/
          git commit -m "[Automatic] Update catalog and badges" || echo "Nothing to commit"
          git push || echo "Nothing to push"

  JPG:
    runs-on: ubuntu-latest
    needs: MainZone

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository after MainZone commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --ff-only

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate JPEG derivatives
        run: |
          python JPG/generate_jpg.py \
            --input "${{ env.IMAGES_DIR }}" \
            --output "${{ env.JPG_DIR }}" \
            --quality 85 \
            --overwrite

      - name: Upload JPEG derivatives artifact
        uses: actions/upload-artifact@v4
        with:
          name: jpg-derivatives-frene-volume-1
          path: ${{ env.JPG_DIR }}


  PDF_A2U:
    runs-on: ubuntu-latest
    needs: JPG

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository after JPG commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --ff-only

      - name: Download JPEG derivatives artifact
        uses: actions/download-artifact@v4
        with:
          name: jpg-derivatives-frene-volume-1
          path: ${{ env.JPG_DIR }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip icc-profiles-free

      - name: Install veraPDF CLI
        shell: bash
        run: |
          wget -q http://downloads.verapdf.org/rel/verapdf-installer.zip
          unzip -q verapdf-installer.zip

          VERAPDF_INSTALL_DIR=$(find . -maxdepth 2 -type f -name "verapdf-install" -exec dirname {} \; | head -n 1)
          echo "Installer trouvé dans : $VERAPDF_INSTALL_DIR"

          cd "$VERAPDF_INSTALL_DIR"
          chmod +x ./verapdf-install
          printf "1\n${HOME}/verapdf\nO\n1\nN\nY\nN\nN\n1\n" | ./verapdf-install

          echo "${HOME}/verapdf" >> "$GITHUB_PATH"
          echo "${HOME}/verapdf/bin" >> "$GITHUB_PATH"
          "${HOME}/verapdf/verapdf" --version || "${HOME}/verapdf/bin/verapdf" --version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow lxml reportlab pikepdf fonttools

      - name: Generate PDF/A-2u from JPEG derivatives
        run: |
          python PDFA2U/pdfa2u_from_alto.py \
            --data "${{ env.VOLUME_DIR }}" \
            --images "${{ env.JPG_DIR }}" \
            --font "fonts/Noto_Serif/static/NotoSerif-Regular.ttf" \
            --icc "data/PROFIL_ICC/sRGB.icm" \
            --verapdf "verapdf" \
            --validate

      - name: Upload PDF/A-2u artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfa2u-frene-volume-1
          path: |
            ${{ env.PDF_DIR }}/document_pdfa2u.pdf
            ${{ env.PDF_DIR }}/rapport_verapdf_pdfa2u.xml

      - name: Upload PDF/A-2u validation report artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfa2u-validation-report-frene-volume-1
          path: ${{ env.PDF_DIR }}/rapport_verapdf_pdfa2u.xml


  IIIF:
    runs-on: ubuntu-latest
    needs: PDF_A2U

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh repository after PDF_A2U commit
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: git pull --ff-only

      - name: Download JPEG derivatives artifact
        uses: actions/download-artifact@v4
        with:
          name: jpg-derivatives-frene-volume-1
          path: ${{ env.JPG_DIR }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Copy JPEG derivatives to GitHub Pages site
        run: |
          mkdir -p "${{ env.SITE_JPG_DIR }}"
          mkdir -p "$(dirname "${{ env.IIIF_MANIFEST }}")"
          rsync -av --delete "${{ env.JPG_DIR }}/" "${{ env.SITE_JPG_DIR }}/"

      - name: Generate IIIF manifest for TIFY
        run: |
          python manifest_IIIF/generate_iiif_manifest.py \
            --images "${{ env.JPG_DIR }}" \
            --output "${{ env.IIIF_MANIFEST }}" \
            --base-url "${{ env.BASE_URL }}"

      - name: Upload IIIF site files artifact
        uses: actions/upload-artifact@v4
        with:
          name: iiif-site-files-frene-volume-1
          path: |
            ${{ env.SITE_JPG_DIR }}
            ${{ env.IIIF_MANIFEST }}


  COMMIT_EXPORTS:
    runs-on: ubuntu-latest
    needs:
      - HTR_United_Metadata_Generator
      - IIIF

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download JPEG derivatives artifact
        uses: actions/download-artifact@v4
        with:
          name: jpg-derivatives-frene-volume-1
          path: ${{ env.JPG_DIR }}

      - name: Download PDF/A-2u validation report artifact
        uses: actions/download-artifact@v4
        with:
          name: pdfa2u-validation-report-frene-volume-1
          path: ${{ env.PDF_DIR }}

      - name: Download IIIF site files artifact
        uses: actions/download-artifact@v4
        with:
          name: iiif-site-files-frene-volume-1
          path: .

      - name: Commit generated export files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git pull --rebase --autostash origin main

          git add "${{ env.JPG_DIR }}"
          git add "${{ env.SITE_JPG_DIR }}" "${{ env.IIIF_MANIFEST }}"
          git add "${{ env.PDF_DIR }}/rapport_verapdf_pdfa2u.xml" || true

          git commit -m "[Automatic] Generate JPG, IIIF and PDF validation outputs" || echo "No changes to commit"
          git push || echo "Nothing to push"

  HTRUC:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_HTR }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install htruc

      - name: Run HTRUC
        run: |
          htruc test htr-united.yml

  HTRVX:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION_HTR }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install htrvx

      - name: Run HTRVX
        run: |
          htrvx \
            --verbose \
            --group \
            --format alto \
            --check-empty \
            --segmonto \
            --xsd \
            ./data/**/*.xml
